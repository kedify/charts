{{- if .Values.agent.multicluster.localCluster.enabled }}
{{- $localCluster := .Values.agent.multicluster.localCluster }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $localCluster.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    sigs.k8s.io/multicluster-runtime-kubeconfig: "true"
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: {{ $localCluster.name }}
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: kedify-agent
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: kedify-agent@{{ $localCluster.name }}
        context:
          cluster: {{ $localCluster.name }}
          user: kedify-agent
    current-context: kedify-agent@{{ $localCluster.name }}
{{- end }}
