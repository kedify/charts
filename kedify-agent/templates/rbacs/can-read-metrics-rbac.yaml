{{- if .Values.agent.rbac.create }}
{{- if .Values.agent.rbac.readMetrics }}
{{- $legacyContainerResourceMetricsEnabled := .Values.agent.resourceMetrics.legacy.enabled -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: can-read-metrics
rules:
{{- if $legacyContainerResourceMetricsEnabled }}
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
{{- end }}
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - list
  - watch
  - get
{{- if $legacyContainerResourceMetricsEnabled }}
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  verbs:
  - get
  - list
{{- end }}
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
{{- if $legacyContainerResourceMetricsEnabled }}
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
{{- end }}

# if metricsWatchNamespace is empty => apply the cluster role using ClusterRoleBinding (all namespaces)
# otherwise use RoleBinding and apply it to only whitelisted namespaces (+add .Release.Namespace implicitly)
{{- if not .Values.agent.metricsWatchNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kedify-agent-can-read-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: can-read-metrics
subjects:
- kind: ServiceAccount
  name: kedify-agent
  namespace: {{ .Release.Namespace }}
{{- else }}
  {{- $namespaces := append (splitList "," .Values.agent.metricsWatchNamespace ) .Release.Namespace -}}
  {{- range $namespaces }}
---
# Role binding for namespace '{{ . }}'
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kedify-agent-can-read-metrics
  namespace: {{ . | trim }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: can-read-metrics
subjects:
- kind: ServiceAccount
  name: kedify-agent
  namespace: {{ $.Release.Namespace }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
