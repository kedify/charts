{{- $scalingPoliciesEnabled := eq (include "kedify-agent.featureEnabled" (list . "scalingPoliciesEnabled")) "true" -}}
{{- $distributedScaledJobsEnabled := eq (include "kedify-agent.featureEnabled" (list . "distributedScaledJobsEnabled")) "true" -}}
{{- $distributedScaledObjectsEnabled := eq (include "kedify-agent.featureEnabled" (list . "distributedScaledObjectsEnabled")) "true" -}}
{{- $scaleAdaptersEnabled := eq (include "kedify-agent.featureEnabled" (list . "scaleAdaptersEnabled")) "true" -}}
{{- $podResourceProfilesEnabled := eq (include "kedify-agent.featureEnabled" (list . "podResourceProfilesEnabled")) "true" -}}
{{- $prpRequiresAnnotatedPods := eq (include "kedify-agent.featureEnabled" (list . "prpRequiresAnnotatedPods")) "true" -}}
{{- $podResourceProfilesDownscaleGuardEnabled := eq (include "kedify-agent.featureEnabled" (list . "podResourceProfilesDownscaleGuardEnabled")) "true" -}}
{{- $podResourceAutoscalersEnabled := eq (include "kedify-agent.featureEnabled" (list . "podResourceAutoscalersEnabled")) "true" -}}
{{- $praRequiresAnnotatedPods := eq (include "kedify-agent.featureEnabled" (list . "praRequiresAnnotatedPods")) "true" -}}
{{- $recommendationsForLabeledNamespaces := eq (include "kedify-agent.featureEnabled" (list . "recommendationsForLabeledNamespaces")) "true" -}}
{{- $kedifyPodAutoscalerEnabled := eq (include "kedify-agent.featureEnabled" (list . "kedifyPodAutoscalerEnabled")) "true" -}}
{{- $multitenantKEDAEnabled := eq (include "kedify-agent.featureEnabled" (list . "multitenantKEDAEnabled")) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    control-plane: kedify-agent
    {{- include "kedify-agent.labels" . | nindent 4 }}
  name: kedify-agent
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      control-plane: kedify-agent
  template:
    metadata:
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        control-plane: kedify-agent
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
    {{- if and (ne .Values.hooks "helm") .Values.agent.createKedifyConfiguration }}
      initContainers:
        - name: wait-for-cr
          image: {{ .Values.agent.kubectlImage.repository }}:{{ .Values.agent.kubectlImage.tag }}
          imagePullPolicy: {{ .Values.agent.kubectlImage.pullPolicy }}
          command: ["sh", "-c", "until kubectl get -n {{ .Release.Namespace }} kedify kedify; do echo waiting for KedifyConfiguration CR; sleep 1; done"]
          {{- with .Values.agent.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- end }}
      containers:
        - args:
          - --leader-elect
          - --zap-log-level={{ default .Values.agent.logLevel .Values.agent.logging.level }}
          - --zap-encoder={{ .Values.agent.logging.format }}
          - --zap-time-encoding={{ .Values.agent.logging.timeEncoding }}
          {{- if .Values.agent.logging.stackTracesEnabled }}
          - --zap-stacktrace-level=error
          {{- end }}
          {{- range $key, $value := .Values.agent.extraArgs }}
          - "--{{ $key }}={{ $value }}"
          {{- end }}
          command:
            - /manager
          env:
            - name: KEDIFY_SERVER
              value: {{ .Values.agent.kedifyServer }}
            {{- with .Values.agent.agentId }}
            - name: KEDIFY_AGENT_ID
              value: {{ . }}
            {{- end }}
            {{- if .Values.agent.orgId }}
            - name: KEDIFY_ORGANIZATION_ID
              value: {{ .Values.agent.orgId }}
            {{- else }}
            - name: KEDIFY_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: kedify-agent
                  key: org_id
            {{- end }}
            - name: KEDIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kedify-agent
                  key: apikey
            - name: KEDIFY_PROXY_CHART_VERSION
              value: {{ .Values.agent.kedifyProxy.chartVersion | quote }}
            - name: KEDIFY_PROXY_CHART
              value: {{ .Values.agent.kedifyProxy.chart | quote }}
            - name: KEDIFY_PROXY_CLUSTER_WIDE
              value: {{ .Values.agent.kedifyProxy.clusterWide | quote }}
            - name: HELM_REPOSITORY_CONFIG
              value: /helm/repository/repositories.yaml
            - name: HELM_REPOSITORY_CACHE
              value: /helm/charts
            {{- if .Values.agent.noColor }}
            - name: NO_COLOR
              value: {{ .Values.agent.noColor | quote }}
            {{- end }}
            {{- if .Values.agent.noBanner }}
            - name: NO_BANNER
              value: {{ .Values.agent.noBanner | quote }}
            {{- end }}
            - name: SCALING_POLICY_ENABLED
              value: {{ $scalingPoliciesEnabled | quote }}
            - name: DSJ_ENABLED
              value: {{ $distributedScaledJobsEnabled | quote }}
            - name: DSO_ENABLED
              value: {{ $distributedScaledObjectsEnabled | quote }}
            - name: SCALE_ADAPTER_ENABLED
              value: {{ $scaleAdaptersEnabled | quote }}
            {{- if $podResourceProfilesEnabled }}
            - name: PRP_ENABLED
              value: {{ $podResourceProfilesEnabled | quote }}
            - name: PRP_REQUIRES_ANNOTATED_PODS
              value: {{ $prpRequiresAnnotatedPods | quote }}
            - name: PRP_MEMORY_DOWNSCALE_GUARD_ENABLED
              value: {{ $podResourceProfilesDownscaleGuardEnabled | quote }}
            {{- end }}
            - name: PRA_ENABLED
              value: {{ $podResourceAutoscalersEnabled | quote }}
            {{- if $podResourceAutoscalersEnabled }}
            - name: PRA_REQUIRES_ANNOTATED_PODS
              value: {{ $praRequiresAnnotatedPods | quote }}
            {{- end }}
            {{- if not $recommendationsForLabeledNamespaces }}
            - name: METRICS_FOR_LABELED_NAMESPACES_ENABLED
              value: {{ $recommendationsForLabeledNamespaces | quote }}
            {{- end }}
            - name: METRICS_WATCH_NAMESPACE
              value: {{ .Values.agent.metricsWatchNamespace | quote }}
            - name: RBAC_READ_NODES
              value: {{ .Values.agent.rbac.readNodes | quote }}
            - name: RBAC_READ_PODS
              value: {{ (or .Values.agent.rbac.readMetrics .Values.agent.rbac.readPods) | quote }}
            - name: RBAC_READ_DEPLOYMENTS_CLUSTERWIDE
              value: {{ .Values.agent.rbac.readDeploymentsClusterwide | quote }}
            - name: RBAC_READ_DEPLOYMENTS
              value: {{ (or .Values.agent.rbac.readMetrics .Values.agent.rbac.readDeployments) | quote }}
            - name: RBAC_READ_SERVICES
              value: {{ .Values.agent.rbac.readServices | quote }}
            - name: RBAC_READ_HPAS
              value: {{ (or .Values.agent.rbac.readMetrics .Values.agent.rbac.readHpas) | quote }}
            - name: RBAC_READ_KPAS
              value: {{ $kedifyPodAutoscalerEnabled | quote }}
            - name: RBAC_READ_CUSTOM_RESOURCE_DEFINITIONS
              value: {{ $multitenantKEDAEnabled | quote }}
            - name: RBAC_READ_STATEFUL_SETS
              value: {{ (or .Values.agent.rbac.readMetrics .Values.agent.rbac.readStatefulSets) | quote }}
            - name: RBAC_READ_DAEMON_SETS
              value: {{ (or .Values.agent.rbac.readMetrics .Values.agent.rbac.readDaemonSets) | quote }}
            - name: RBAC_MANAGE_KUBE_RESOURCES
              value: {{ .Values.agent.rbac.selfUpdates | quote }}
            - name: RBAC_MANAGE_CUSTOM_RESOURCE_DEFINITIONS
              value: {{ or .Values.agent.rbac.shouldBeAbleToInstallKeda .Values.agent.rbac.shouldBeAbleToInstallHttpAddon | quote }}
            - name: RBAC_MANAGE_HELM
              value: {{ or .Values.agent.rbac.shouldBeAbleToInstallKeda .Values.agent.rbac.shouldBeAbleToInstallHttpAddon | quote }}
            - name: RBAC_MANAGE_INGRESS_AUTO_WIRE
              value: {{ .Values.agent.rbac.ingressAutoWire | quote }}
            - name: RBAC_MANAGE_KEDIFY_CONFIG
              value: {{ .Values.agent.rbac.kedifyConfig | quote }}
            - name: KEDIFY_AUTOWIRE_SERVICE_SYNC_PERIOD
              value: {{ .Values.agent.autowire.serviceSyncPeriod | quote }}
            - name: KEDIFY_AUTOWIRE_INGRESS_COOLDOWN_PERIOD
              value: {{ .Values.agent.autowire.ingressCooldownPeriod | quote }}
            - name: KEDIFY_PROXY_CONFIGMAP_WATCHER_ENABLED
              value: {{ .Values.agent.kedifyProxy.proxyConfigmapWatcherEnabled | quote }}
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.agent.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /helm/charts
              name: helm-charts
            - mountPath: /etc/mc/kubeconfigs
              name: kubeconfigs
              readOnly: true
            {{- with .Values.agent.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.agent.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: kedify-agent
      terminationGracePeriodSeconds: 10
      volumes:
        - name: helm-charts
          emptyDir:
            sizeLimit: 50Mi
        - name: kubeconfigs
          secret:
            defaultMode: 420
            secretName: kedify-agent-multicluster-kubeconfigs
      {{- with .Values.agent.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
