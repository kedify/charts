name: Helm Chart CI (HTTP add-on)
on:
  workflow_dispatch:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
    paths:
      - "scripts/kubernetes*"
      - ".github/workflows/ci-http-add-on.yml"
      - "http-add-on/**"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/kubernetes*"
      - ".github/workflows/ci-http-add-on.yml"
      - "http-add-on/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  kubernetes:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Select Kubernetes versions
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bash scripts/kubernetes_test.sh
          versions="$(bash scripts/kubernetes.sh matrix "$EVENT_NAME")"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  verify-crds:
    name: Verify CRDs are up-to-date
    runs-on: ubuntu-slim
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Verify InterceptorRoute CRD matches source
        run: |
          APP_VERSION=$(yq '.appVersion' http-add-on/Chart.yaml)
          echo "Checking CRDs against http-add-on v${APP_VERSION}"

          curl -sSfL "https://raw.githubusercontent.com/kedacore/http-add-on/v${APP_VERSION}/config/crd/bases/http.keda.sh_interceptorroutes.yaml" \
            -o /tmp/source-interceptorroutes.yaml

          # Strip Helm template guards
          grep -v '^{{' http-add-on/templates/crds/crd-interceptorroutes.yaml > /tmp/chart-interceptorroutes.yaml

          if diff -u /tmp/source-interceptorroutes.yaml /tmp/chart-interceptorroutes.yaml; then
            echo "InterceptorRoute CRD is up-to-date"
          else
            echo "::error::InterceptorRoute CRD is out of sync"
            exit 1
          fi

  lint-helm-3-x:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Helm install
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint 'http-add-on' Helm chart
        run: helm lint http-add-on

  deploy-helm-3-x:
    name: Deploy to Kubernetes ${{ matrix.kubernetes.kubernetesVersion }} (${{ matrix.distribution }})
    needs: [lint-helm-3-x, kubernetes]
    runs-on: ubuntu-latest
    env:
      HTTP_ADD_ON_CHART: ${{ matrix.distribution == 'kedify' && './.kedify-chart-ci/http-add-on' || './http-add-on' }}
    strategy:
      fail-fast: false
      matrix:
        distribution: [upstream, kedify]
        kubernetes: ${{ fromJSON(needs.kubernetes.outputs.versions) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check out Kedify release chart
        if: matrix.distribution == 'kedify'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: http-add-on/v0.11.1
          path: .kedify-chart-ci

      - name: Helm install
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create k8s ${{ matrix.kubernetes.kubernetesVersion }} Kind Cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.33.0
          node_image: ${{ matrix.kubernetes.kindImage }}
          kubectl_version: ${{ matrix.kubernetes.kubectlVersion }}

      - name: Verify cluster version
        env:
          KUBERNETES_VERSION: ${{ matrix.kubernetes.kubectlVersion }}
        run: bash scripts/kubernetes.sh verify "$KUBERNETES_VERSION"

      - name: Show Kubernetes version
        run: |
          kubectl version

      - name: Show Kubernetes nodes
        run: |
          kubectl get nodes -o wide

      - name: Show Helm version
        run: |
          helm version

      - name: Create KEDA namespace
        run: kubectl create ns keda

      - name: Generate values
        run: |
          cat <<EOF > keda-values.yaml
          image:
            keda:
              tag: kedify-main
            metricsApiServer:
              tag: kedify-main
            webhooks:
              tag: kedify-main

      - name: Install KEDA chart
        run: helm install keda ./keda/ --namespace keda --values keda-values.yaml

      - name: Generate values
        run: |
          HTTP_ADD_ON_REPOSITORY=kedacore
          HTTP_ADD_ON_TAG="$(yq '.appVersion' "$HTTP_ADD_ON_CHART/Chart.yaml")"
          if [[ "${{ matrix.distribution }}" == "kedify" ]]; then
            HTTP_ADD_ON_REPOSITORY=kedify
            HTTP_ADD_ON_TAG=kedify-main
          fi
          cat <<EOF > test-values.yaml
          additionalLabels:
            random: value
          images:
            operator: ghcr.io/${HTTP_ADD_ON_REPOSITORY}/http-add-on-operator
            interceptor: ghcr.io/${HTTP_ADD_ON_REPOSITORY}/http-add-on-interceptor
            scaler: ghcr.io/${HTTP_ADD_ON_REPOSITORY}/http-add-on-scaler
            tag: "${HTTP_ADD_ON_TAG}"
          rbac:
            aggregateToDefaultRoles: true
          operator:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: "kubernetes.io/hostname"
                whenUnsatisfiable: "ScheduleAnyway"
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: operator
                    app.kubernetes.io/instance: http-add-on
                    app.kubernetes.io/name: http-add-on
          scaler:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: "kubernetes.io/hostname"
                whenUnsatisfiable: "ScheduleAnyway"
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: operator
                    app.kubernetes.io/instance: http-add-on
                    app.kubernetes.io/name: http-add-on
          interceptor:
            replicas:
              min: 1
            proxy:
              appProtocol: ""
          EOF

      - name: Template Helm chart
        run: helm template http-add-on "$HTTP_ADD_ON_CHART" --namespace keda --values test-values.yaml

      - name: Install Helm chart
        run: helm install http-add-on "$HTTP_ADD_ON_CHART" --namespace keda --values test-values.yaml --wait

      - name: Show Kubernetes resources
        run: kubectl get all --namespace keda
        if: always()

      - name: Get all HTTPScaledObjects
        run: kubectl get httpscaledobjects

      - name: Get all CRDs
        run: kubectl get crds

      - name: Get InterceptorRoute CRD
        if: matrix.distribution == 'upstream'
        run: kubectl get crds/interceptorroutes.http.keda.sh

      - name: Describe InterceptorRoute CRD
        if: matrix.distribution == 'upstream'
        run: kubectl describe crds/interceptorroutes.http.keda.sh

      # TODO: Drop `HTTPScaledObject` specific steps after crd is DEPRECATED
      - name: Get HTTPScaledObject CRD
        run: kubectl get crds/httpscaledobjects.http.keda.sh

      - name: Describe HTTPScaledObject CRD
        run: kubectl describe crds/httpscaledobjects.http.keda.sh

      - name: Validate Interceptor ScaledObject
        run: |
          for N in {1..3}
          do
            READY=$(kubectl get so/keda-add-ons-http-interceptor -n keda -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            echo "ScaledObjet is ready: $READY"
            if [[ "$READY" == "True" ]]; then            
              exit 0
            fi
            sleep 15s
          done
          exit 1
