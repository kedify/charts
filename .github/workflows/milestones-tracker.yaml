name: milestones tracking with release

on:
  workflow_call:
    inputs:
      chart:
        description: 'chart name'
        type: string
        required: true
      prNumber:
        description: 'pull request number'
        type: string
        required: true
    secrets:
      PAT_TOKEN:
        description: 'PAT for gh CLI operations requiring elevated permissions'
        required: false
      AWS_GITHUB_ROLE_ARN:
        description: 'AWS role ARN used for EKS add-on publishing'
        required: true
      SLACK_WEBHOOK_URL:
        description: 'Slack webhook for failed post-release checks'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  milestone_tracker:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.milestone_tracking.outputs.should_release }}
      version: ${{ steps.milestone_tracking.outputs.version }}
      merge_commit_sha: ${{ steps.merge_commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get merge commit SHA
        id: merge_commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.prNumber }}
        run: |
          set -euo pipefail
          sha=$(gh pr view -R kedify/charts "${PR_NUMBER}" --json 'mergeCommit' --jq '.mergeCommit.oid')
          if [[ -z "$sha" || "$sha" == "null" ]]; then
              echo "Failed to resolve merge commit SHA for PR #${PR_NUMBER}" >&2
              exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Ensure correct milestone
        id: milestone_tracking
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.prNumber }}
        run: |
          set -euo pipefail

          has_milestone=$(gh pr view -R kedify/charts ${PR_NUMBER} --json 'milestone' --jq '.milestone.title | length')
          if [[ "$has_milestone" == 0 ]]; then
              echo "setting '${{ inputs.chart }}/next' milestone for PR #${PR_NUMBER}"
              gh pr edit -R kedify/charts ${PR_NUMBER} --milestone "${{ inputs.chart }}/next"
              exit 0
          fi
          labels=( $(gh pr view -R kedify/charts ${PR_NUMBER} --json 'labels' --jq '.labels[].name') )
          has_release_label="false"
          for label in "${labels[@]}"; do
              if [[ "$label" == "release/${{ inputs.chart }}" ]]; then
                  has_release_label="true"
              fi
          done

          if [[ "$has_release_label" != "true" ]]; then
              echo "not a release PR #${PR_NUMBER}, labels: ${labels[*]}"
              exit 0
          fi
          milestone=$(gh pr view -R kedify/charts ${PR_NUMBER} --json 'milestone' --jq '.milestone.title')
          echo "release PR #${PR_NUMBER} with milestone: $milestone"
          # Resolve the '/next' milestone number, then enumerate its merged PRs via GraphQL.
          # The REST search and issues APIs are backed by a search index that goes stale for
          # extended periods and returns an incomplete (or empty) list, which stranded merged
          # PRs in '/next' across releases and duplicated them in later changelogs. The GraphQL
          # milestone->pullRequests connection traverses the relationship directly and stays
          # consistent immediately after a merge.
          next_milestone_number=$(gh api --paginate '/repos/kedify/charts/milestones?state=all' \
              --jq '.[] | select(.title == "${{ inputs.chart }}/next") | .number')
          next_milestone_prs=()
          if [[ -z "$next_milestone_number" ]]; then
              echo "no '${{ inputs.chart }}/next' milestone found; nothing to move"
          elif [[ "$next_milestone_number" =~ ^[0-9]+$ ]]; then
              # Paginate the connection with gh's built-in GraphQL pagination (query takes an
              # $endCursor variable and returns pageInfo) so milestones with more than 100 merged
              # PRs are never truncated, which would otherwise reintroduce the stranding bug.
              next_milestone_prs=( $(gh api graphql --paginate -f query='
                query($endCursor: String) {
                  repository(owner: "kedify", name: "charts") {
                    milestone(number: '"${next_milestone_number}"') {
                      pullRequests(first: 100, after: $endCursor, states: MERGED) {
                        nodes { number }
                        pageInfo { hasNextPage endCursor }
                      } } } }' --jq '.data.repository.milestone.pullRequests.nodes[].number') )
          else
              echo "expected exactly one '${{ inputs.chart }}/next' milestone, got: '${next_milestone_number}'" >&2
              exit 1
          fi
          echo "found ${#next_milestone_prs[@]} merged PR(s) in ${{ inputs.chart }}/next"
          for pr in "${next_milestone_prs[@]}"; do
              echo "moving PR $pr milestone '${{ inputs.chart }}/next' => '$milestone'"
              gh pr edit -R kedify/charts "$pr" --milestone "$milestone"
          done
          release_tag=${milestone#*/}
          pr_body="$(gh pr view $PR_NUMBER --json 'body' --jq '.body')"

          # Read pins from the exact chart release commit, rather than moving main.
          compatibility=''
          if git cat-file -e "${{ steps.merge_commit.outputs.sha }}:scripts/kubernetes-versions.json"; then
            git show "${{ steps.merge_commit.outputs.sha }}:scripts/kubernetes-versions.json" > "$RUNNER_TEMP/kubernetes-versions.json"
            versions="$(jq -er '
              map(capture("^kindest/node:v(?<minor>1\\.[0-9]+)\\.[0-9]+@sha256:[0-9a-f]{64}$").minor // error("invalid Kubernetes image")) |
              sort_by(split(".")[1] | tonumber) | reverse |
              map(split(".")[1] | tonumber) as $minors |
              if $minors == [$minors[0], $minors[0]-1, $minors[0]-2]
              then join(", ") else error("expected three consecutive Kubernetes minors") end
            ' "$RUNNER_TEMP/kubernetes-versions.json")"
            printf -v compatibility '\n<!-- kubernetes-compatibility -->\n## Compatibility\n\n| Chart | Kubernetes CI targets |\n| --- | --- |\n| %s %s | %s |\n' "${{ inputs.chart }}" "$release_tag" "$versions"

          else
              echo "::notice::This release revision has no Kubernetes compatibility manifest; omitting the table."
          fi

          if gh release view "$milestone" > /dev/null; then
              echo "release $milestone already exists"
              if [[ -n "$compatibility" ]]; then
                  gh release view "$milestone" --json body --jq '.body' > "$RUNNER_TEMP/release-notes.md"
                  if ! grep -Fq '<!-- kubernetes-compatibility -->' "$RUNNER_TEMP/release-notes.md"; then
                      printf '%s' "$compatibility" >> "$RUNNER_TEMP/release-notes.md"
                      gh release edit "$milestone" --notes-file "$RUNNER_TEMP/release-notes.md"
                  fi
              fi
          else
              echo "creating release $milestone"
              gh release create -R kedify/charts "$milestone" --latest --title "${{ inputs.chart }}: $release_tag" --notes "${pr_body}${compatibility}" --target "${{ steps.merge_commit.outputs.sha }}"
          fi
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$release_tag" >> $GITHUB_OUTPUT
  release:
    needs: milestone_tracker
    if: needs.milestone_tracker.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.milestone_tracker.outputs.merge_commit_sha }}
      - name: Publish ${{ inputs.chart }} Helm Chart
        uses: wozniakjan/helm-gh-pages@single_chart_path
        if: "${{ needs.milestone_tracker.outputs.should_release == 'true' }}"
        with:
          token: ${{ github.token }}
          linting: "off"
          dependencies: "kedify,https://kedify.github.io/charts"
          charts_dir: "."
          single_chart_path: "./${{ inputs.chart }}/"
      - name: Publish OCI ${{ inputs.chart }} Helm Chart
        if: "${{ needs.milestone_tracker.outputs.should_release == 'true' && inputs.chart == 'kedify-proxy' }}"
        uses: appany/helm-oci-chart-releaser@v0.3.0
        with:
          name: ${{ inputs.chart }}
          repository: kedify/charts
          tag: ${{ needs.milestone_tracker.outputs.version }}
          path: ${{ inputs.chart }}
          registry: ghcr.io
          registry_username: kedify
          registry_password: ${{ secrets.GITHUB_TOKEN }}

  kubernetes:
    needs: milestone_tracker
    if: needs.milestone_tracker.outputs.should_release == 'true' && inputs.chart == 'kedify-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      minors: ${{ steps.matrix.outputs.minors }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.milestone_tracker.outputs.merge_commit_sha }}
          persist-credentials: false
      - name: Select the released chart's Kubernetes versions
        id: matrix
        run: |
          set -euo pipefail
          versions="$(bash scripts/kubernetes.sh matrix release)"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "minors=$(jq -c 'map(.kubernetesVersion | ltrimstr("v"))' <<< "$versions")" >> "$GITHUB_OUTPUT"
          echo "Release compatibility checks: $(jq -r 'map(.kubernetesVersion) | join(", ")' <<< "$versions")" >> "$GITHUB_STEP_SUMMARY"

  autoscaling_smoke:
    name: Agent release smoke / Kubernetes ${{ matrix.kubernetes.kubernetesVersion }}
    needs: [milestone_tracker, release, kubernetes]
    if: needs.milestone_tracker.outputs.should_release == 'true' && inputs.chart == 'kedify-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ${{ fromJSON(needs.kubernetes.outputs.versions) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: checks
    steps:
      - name: Check out the released chart
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.milestone_tracker.outputs.merge_commit_sha }}
          path: release
          persist-credentials: false

      - name: Check out autoscaling checks
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kedify/autoscaling-checks
          ref: a62945310e320de97ce4526194eaaa2a323ba6f8 # v0.0.2
          path: checks
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Create pinned Kubernetes cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.33.0
          node_image: ${{ matrix.kubernetes.kindImage }}
          kubectl_version: ${{ matrix.kubernetes.kubectlVersion }}

      - name: Verify cluster version
        env:
          KUBERNETES_VERSION: ${{ matrix.kubernetes.kubectlVersion }}
        run: bash ../release/scripts/kubernetes.sh verify "$KUBERNETES_VERSION"

      # K3s bundled Metrics Server; kind needs it for the existing CPU check.
      - name: Install resource metrics for the test cluster
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml \
            --output "$RUNNER_TEMP/metrics-server.yaml"
          echo "3c7f57cdbee0f57fb0259a150e8f6d6cb4f29d72d1aa5dce8803151dd6d4c2a1  $RUNNER_TEMP/metrics-server.yaml" | sha256sum --check
          kubectl apply -f "$RUNNER_TEMP/metrics-server.yaml"
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=180s

      - name: Wait for the released chart
        env:
          VERSION: ${{ needs.milestone_tracker.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            helm repo add kedify https://kedify.github.io/charts --force-update
            helm repo update kedify
            if helm show chart kedify/kedify-agent --version "$VERSION" >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "kedify-agent chart $VERSION is not available after 5 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Run HTTP and CPU autoscaling checks
        env:
          VERSION: ${{ needs.milestone_tracker.outputs.version }}
        run: >-
          make test-e2e
          IMAGE=ghcr.io/kedify/autoscaling-checks
          TAG=v0.0.2
          IMAGE_PULL_POLICY=IfNotPresent
          CHECK_TIMEOUT_SECONDS=1200
          HTTP_ENABLED=true
          CPU_ENABLED=true
          PROMETHEUS_ENABLED=false
          OTEL_ENABLED=false
          MEMORY_ENABLED=false
          KEDIFY_AGENT_ENABLED=true
          KEDIFY_AGENT_CHART_VERSION="$VERSION"
          KEDIFY_AGENT_ORG_ID=01234567-0123-4321-9999-012345678901
          KEDIFY_AGENT_API_KEY=kfy_12345678901234567890123456789012

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl -n keda logs deploy/kedify-agent --tail=200 || true

  update_supported_kubernetes:
    needs: [milestone_tracker, release, kubernetes, autoscaling_smoke]
    if: needs.milestone_tracker.outputs.should_release == 'true' && inputs.chart == 'kedify-agent'
    runs-on: ubuntu-latest
    # Only serialize docs writers; release publication/testing can run concurrently.
    concurrency:
      group: supported-kubernetes-docs
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the released chart's updater
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.milestone_tracker.outputs.merge_commit_sha }}
          path: release
          persist-credentials: false
      - name: Check out Marketing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kedify/marketing
          ref: main
          # Existing release PAT also needs Marketing contents/PR write access.
          token: ${{ secrets.PAT_TOKEN }}
          path: marketing
          fetch-depth: 0
      - name: Propose the validated Kubernetes support list
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SUPPORTED_KUBERNETES_VERSIONS: ${{ needs.kubernetes.outputs.minors }}
          CHART_VERSION: ${{ needs.milestone_tracker.outputs.version }}
          SOURCE_SHA: ${{ needs.milestone_tracker.outputs.merge_commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash release/scripts/update-supported-kubernetes.sh marketing

  notify_autoscaling_smoke_failure:
    needs: [milestone_tracker, autoscaling_smoke]
    if: >-
      always() &&
      needs.milestone_tracker.outputs.should_release == 'true' &&
      inputs.chart == 'kedify-agent' &&
      (needs.autoscaling_smoke.result == 'failure' || needs.autoscaling_smoke.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Slack about failed post-release smoke test
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-type: application/json' \
            --data '{"text":"🚨 Kedify Agent ${{ needs.milestone_tracker.outputs.version }} post-release autoscaling smoke test failed. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the failed GitHub Actions job>."}' \
            "${SLACK_WEBHOOK_URL}"

  post_release:
    needs: [milestone_tracker, release]
    if: needs.milestone_tracker.outputs.should_release == 'true' && inputs.chart == 'kedify-agent'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PAT token presence for kedify-agent post-release
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN:-}" ]]; then
            echo "PAT_TOKEN secret is required for kedify-agent post_release (asset upload + operator release trigger)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.milestone_tracker.outputs.merge_commit_sha }}
      - name: Generate air-gapped image digests JSON
        env:
          VERSION: ${{ needs.milestone_tracker.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          CHART_DIR="$PWD/kedify-agent" "$PWD/scripts/print-image-names.sh" > ./artifacts/air-gapped-images.txt
          "$PWD/scripts/update-generated-images-json.sh" \
            "./artifacts/generated-images.json" \
            "./artifacts/air-gapped-images.txt" \
            "$VERSION" \
            "$(date -u +%F)"
          cat ./artifacts/generated-images.json
      - name: Upload image digest asset to existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          CHART: ${{ inputs.chart }}
          VERSION: ${{ needs.milestone_tracker.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$CHART/$VERSION" ./artifacts/generated-images.json --repo kedify/charts --clobber
      - name: Trigger Openshift Operator release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ needs.milestone_tracker.outputs.version }}
        run: |
          set -euo pipefail
          operator_input_version="${VERSION#v}"
          gh workflow run release.yaml \
            --repo kedify/kedify-agent-helm-operator \
            -f version="${operator_input_version}"

  eks_addon_release:
    needs: [milestone_tracker, release, post_release]
    if: needs.milestone_tracker.outputs.should_release == 'true' && inputs.chart == 'kedify-agent'
    permissions:
       contents: write
       id-token: write
    uses: ./.github/workflows/gh-release-eks-addon.yml
    with:
      source-ref: ${{ needs.milestone_tracker.outputs.merge_commit_sha }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
