name: Helm Chart CI (Core)
on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
    paths:
      - 'scripts/kubernetes*'
      - '.github/workflows/ci-core.yml'
      - 'keda/**'
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'scripts/kubernetes*'
      - '.github/workflows/ci-core.yml'
      - 'keda/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  kubernetes:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Select Kubernetes versions
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bash scripts/kubernetes_test.sh
          versions="$(bash scripts/kubernetes.sh matrix "$EVENT_NAME")"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  lint-helm-3-x:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Helm install
      uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

    - name: Lint 'KEDA' Helm chart
      run: helm lint keda

    - name: Verify KPA RBAC and arguments
      run: ./keda/test/kpa-rendering.sh

    - name: Verify label shard rendering
      run: ./kedify-agent/test/sharding-rendering.sh

  deploy-helm-3-x:
    name: Deploy to Kubernetes ${{ matrix.kubernetes.kubernetesVersion }} in '${{matrix.namespace}}' namespace (${{ (matrix.enableAzureWorkloadIdentity == true && 'With Azure Workload Identity') || 'Without Azure Workload Identity' }} | ${{ (matrix.enableCertManager == true && 'With cert-manager') || 'Without cert-manager' }})
    needs: [lint-helm-3-x, kubernetes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enableAzureWorkloadIdentity: [false, true]
        kubernetes: ${{ fromJSON(needs.kubernetes.outputs.versions) }}
        namespace: ["keda", "not-keda"]
        enableCertManager: [false, true]
        include:
          # Azure Workload Identity
        - enableAzureWorkloadIdentity: true
          tenantId: contoso
          clientId: ABC
        - enableAzureWorkloadIdentity: false
          tenantId: ""
          clientId: ""
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Helm install
      uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

    - name: Create k8s ${{ matrix.kubernetes.kubernetesVersion }} Kind Cluster
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        # renovate: datasource=github-releases depName=kubernetes-sigs/kind
        version: v0.33.0
        node_image: ${{ matrix.kubernetes.kindImage }}
        kubectl_version: ${{ matrix.kubernetes.kubectlVersion }}

    - name: Verify cluster version
      env:
        KUBERNETES_VERSION: ${{ matrix.kubernetes.kubectlVersion }}
      run: bash scripts/kubernetes.sh verify "$KUBERNETES_VERSION"

    - name: Show Kubernetes version
      run: |
        kubectl version

    - name: Show Kubernetes nodes
      run: |
        kubectl get nodes -o wide

    - name: Show Helm version
      run: |
        helm version

    - name: Generate values
      run: |
        cat <<EOF > test-values.yaml
        podIdentity:
          azureWorkload:
            enabled: ${{ matrix.enableAzureWorkloadIdentity }}
            tenantId: ${{ matrix.tenantId }}
            clientId: ${{ matrix.clientId }}
        podDisruptionBudget:
          operator:
            maxUnavailable: 1
          metricServer:
            maxUnavailable: 1
          webhooks:
            maxUnavailable: 1
        prometheus:
          operator:
            enabled: true
            podMonitor:
              enabled: true
            serviceMonitor:
              enabled: true
              relabelings:
              - regex: (go_.*)
                action: drop
          webhooks:
            enabled: true
            serviceMonitor:
              enabled: true
              relabelings:
              - regex: (go_.*)
                action: drop
          metricServer:
            enabled: true
            serviceMonitor:
              enabled: true
              relabelings:
              - regex: (go_.*)
                action: drop
        webhooks:
          failurePolicy: Fail
        certificates:
          autoGenerated: true
          certManager:
            enabled: ${{ matrix.enableCertManager }}
            generateCA: true
        extraInitContainers:
          - name: hello-once
            args:
              - -c
              - "echo 'Hello World!'"
            command:
              - /bin/sh
            image: 'busybox:glibc'
        extraContainers:
          - name: hello-many
            args:
              - -c
              - "while true; do echo hi; sleep 300; done"
            command:
              - /bin/sh
            image: 'busybox:glibc'
        extraObjects:
          - apiVersion: keda.sh/v1alpha1
            kind: ClusterTriggerAuthentication
            metadata:
              name: aws-credentials
              namespace: keda
              annotations:
                helm.sh/hook: post-install
            spec:
              podIdentity:
                provider: aws-eks
        additionalAnnotations:
          sample: "annotation"
        service:
          additionalAnnotations:
            hello: "cloud-native world"
        EOF

    - name: Install deps
      run: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add jetstack https://charts.jetstack.io
        helm repo update
        helm install prometheus-stack prometheus-community/prometheus-operator-crds --namespace monitoring --create-namespace --wait
        helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true

    - name: Create KEDA's namespace (${{ matrix.namespace }})
      run: kubectl create ns ${{ matrix.namespace }}

    - name: Template Helm chart
      run: helm template keda ./keda/ --namespace ${{ matrix.namespace }} --values test-values.yaml

    - name: Install Helm chart
      run: helm install keda ./keda/ --namespace ${{ matrix.namespace }} --values test-values.yaml --wait

    - name: Show Kubernetes resources (KEDA)
      run: kubectl get all --namespace ${{ matrix.namespace }}
      if: always()

    - name: Show Kubernetes resources (Monitoring)
      run: kubectl get all --namespace monitoring
      if: always()

    - name: Get all CRDs
      run: kubectl get crds -o wide

    - name: Verify clustertriggerauthentications.keda.sh CRD is installed
      run: kubectl get crd/clustertriggerauthentications.keda.sh -o wide

    - name: Verify triggerauthentications.keda.sh CRD is installed
      run: kubectl get crd/triggerauthentications.keda.sh -o wide

    - name: Verify scaledjobs.keda.sh CRD is installed
      run: kubectl get crd/scaledjobs.keda.sh -o wide

    - name: Verify scaledobjects.keda.sh CRD is installed
      run: kubectl get crd/scaledobjects.keda.sh -o wide
    
    - name: Verify cloudeventsources.eventing.keda.sh CRD is installed
      run: kubectl get crd/cloudeventsources.eventing.keda.sh -o wide

    - name: Verify clustercloudeventsources.eventing.keda.sh CRD is installed
      run: kubectl get crd/clustercloudeventsources.eventing.keda.sh -o wide

    - name: Get all ScaledObjects
      run: kubectl get scaledobjects -o wide

    - name: Get all ScaledJobs
      run: kubectl get scaledjobs -o wide

    - name: Get all TriggerAuthentication
      run: kubectl get triggerauth -o wide

    - name: Get all ClusterTriggerAuthentication
      run: kubectl get clustertriggerauth -o wide

    - name: Get all CloudEventSource
      run: kubectl get cloudeventsource -o wide

    - name: Deploy Nginx with autoscaling
      run: kubectl apply -f ./samples/nginx-scaledobject.yml

    - name: Get our Nginx ScaledObject
      run: kubectl get scaledobjects/nginx-autoscaling -o wide
      if: always()
