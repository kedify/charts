name: Update Kubernetes test versions

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository_owner == 'kedify'
    # Public repo: use a local copy, as for repository backups.
    uses: ./.github/workflows/kubernetes-versions-template.yml
    with:
      manifest: scripts/kubernetes-versions.json
      count: 3
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
