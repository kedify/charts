{{- if and .Values.rbac.create .Values.multicluster.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ include "keda.operator.name" . }}
    {{- include "keda.labels" . | nindent 4 }}
  name: {{ include "keda.operator.name" . }}-clusterregistrations
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - multicluster.kedify.io
  resources:
  - clusterregistrations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ include "keda.operator.name" . }}
    {{- include "keda.labels" . | nindent 4 }}
  name: {{ include "keda.operator.name" . }}-clusterregistrations
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "keda.operator.name" . }}-clusterregistrations
subjects:
- kind: ServiceAccount
  name: {{ include "keda.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
